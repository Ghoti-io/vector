<?xml version="1.0"?>
<!-- clip-path written as a basic shape: each of circle(), ellipse(), inset(), polygon() and path(), with the three kinds of reference box (H11). -->
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <rect x="4" y="4" width="24" height="24" fill="#c0392b" clip-path="circle()"/>
  <rect x="32" y="4" width="24" height="24" fill="#2980b9" clip-path="ellipse(40% 25% at 30% 70%) fill-box"/>
  <rect x="60" y="4" width="24" height="24" fill="#27ae60" clip-path="inset(10% 20% round 6px / 3px) fill-box"/>
  <rect x="88" y="4" width="24" height="24" fill="#f39c12" clip-path="polygon(evenodd, 50% 0, 100% 100%, 0 40%, 100% 40%, 0 100%) fill-box"/>
  <rect x="4" y="34" width="24" height="24" fill="#8e44ad" stroke="#2c3e50" stroke-width="6" clip-path="circle() stroke-box"/>
  <rect x="32" y="34" width="24" height="24" fill="#16a085" clip-path="path('M0 0H24L0 24Z') fill-box"/>
  <circle cx="72" cy="46" r="12" fill="#d35400" clip-path="circle(8px at 100% 0) fill-box"/>
  <rect x="90" y="34" width="24" height="24" fill="#7f8c8d" clip-path="circle(30px at 0 0) view-box"/>
  <rect x="4" y="64" width="24" height="12" fill="#c0392b" clip-path="circle(0px) fill-box"/>
  <rect x="32" y="64" width="24" height="12" fill="#2980b9" clip-path="circle(banana)"/>
</svg>
