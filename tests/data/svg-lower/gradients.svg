<?xml version="1.0"?>
<!-- Gradients are resources of the waist placed in the element's box or in user space, with their stops and spread (H1 to H8). -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="96" height="64" viewBox="0 0 96 64">
  <defs>
    <linearGradient id="a"><stop offset="0" stop-color="#c0392b"/><stop offset="1" stop-color="#2980b9"/></linearGradient>
    <linearGradient id="b" xlink:href="#a" x1="0.25" x2="0.75" spreadMethod="reflect" gradientTransform="rotate(20)"/>
    <radialGradient id="c" xlink:href="#a" fx="0.3" fr="0.1" spreadMethod="repeat" r="0.4"/>
    <linearGradient id="d" gradientUnits="userSpaceOnUse" x1="64" x2="92">
      <stop offset="-1" stop-color="#27ae60" stop-opacity="0.9"/><stop offset="0.2" stop-color="currentColor"/><stop offset="0.2" stop-color="#f39c12"/><stop offset="2" stop-color="#8e44ad"/>
    </linearGradient>
