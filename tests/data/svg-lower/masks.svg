<?xml version="1.0"?>
<!-- Masks: luminance and alpha, a region in the box's fractions and in user units, content in the box's units, a mask on the mask, a mask that names itself, and a mask on a group (G9). -->
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="fade"><stop offset="0" stop-color="white"/><stop offset="1" stop-color="black"/></linearGradient>
    <mask id="lum"><rect x="0" y="0" width="100" height="100" fill="url(#fade)"/></mask>
    <mask id="alpha" mask-type="alpha"><circle cx="20" cy="50" r="14" fill="black"/></mask>
    <mask id="user" maskUnits="userSpaceOnUse" x="50" y="0" width="30" height="30"><rect width="100" height="100" fill="white"/></mask>
    <mask id="units" maskContentUnits="objectBoundingBox"><rect x="0.1" y="0.1" width="0.8" height="0.8" fill="white"/></mask>
    <mask id="inner"><rect width="100" height="100" fill="white" fill-opacity="0.5"/></mask>
    <mask id="outer" mask="url(#inner)"><rect width="100" height="100" fill="white"/></mask>
    <mask id="loop" mask="url(#loop)"><rect width="100" height="100" fill="white"/></mask>
  </defs>
  <rect x="2" y="2" width="30" height="20" fill="#c0392b" mask="url(#lum)"/>
  <rect x="2" y="30" width="30" height="30" fill="#2980b9" mask="url(#alpha)"/>
  <rect x="50" y="2" width="40" height="40" fill="#27ae60" mask="url(#user)"/>
  <rect x="36" y="2" width="12" height="40" fill="#8e44ad" mask="url(#units)" transform="translate(0 4)"/>
  <rect x="2" y="70" width="20" height="20" fill="#f39c12" mask="url(#outer)"/>
  <rect x="26" y="70" width="20" height="20" fill="#16a085" mask="url(#loop)"/>
  <g mask="url(#lum)"><rect x="52" y="52" width="20" height="20" fill="#2c3e50"/><rect x="70" y="70" width="20" height="20" fill="#d35400"/></g>
</svg>
