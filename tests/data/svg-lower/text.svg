<?xml version="1.0"?>
<!-- Text: a line in the test font (every glyph a box), anchors, a bold face, a size, a fill, and white space (G11). -->
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80" font-family="sans-serif" font-size="12">
  <text x="4" y="14">ABC abc</text>
  <text x="60" y="30" text-anchor="middle" font-weight="bold" fill="#c0392b">Bold line</text>
  <text x="116" y="46" text-anchor="end" font-size="8" fill="#2980b9" opacity="0.7">End anchor</text>
  <text x="4" y="62" fill="#27ae60">  collapsed
     white   space  </text>
  <text x="4" y="76" font-size="9">One <tspan fill="#8e44ad" font-weight="bold">two</tspan> <tspan x="70" dy="-4" fill="#16a085">three</tspan></text>
  <linearGradient id="fade"><stop offset="0" stop-color="#c0392b"/><stop offset="1" stop-color="#2980b9"/></linearGradient>
  <text x="4" y="40" font-size="14" fill="url(#fade)" stroke="#000000" stroke-width="0.5" paint-order="stroke">Paint</text>
  <text x="70" y="40" font-size="10" text-rendering="optimizeSpeed">Crisp <tspan opacity="0.5">fade</tspan></text>
  <text x="4" y="30" font-size="6" letter-spacing="1" word-spacing="3">spaced out words</text>
  <text x="70" y="56" font-size="6" textLength="40" fill="#8e44ad">length</text>
  <text x="70" y="64" font-size="6" textLength="50" lengthAdjust="spacingAndGlyphs" fill="#d35400">stretch</text>
  <text x="70" y="72" font-size="6" font-variant="small-caps" style="font-kerning: none">Small Caps</text>
  <text x="4" y="78" font-size="8">Base<tspan baseline-shift="super" font-size="5">up</tspan><tspan baseline-shift="sub" font-size="5">down</tspan> <tspan alignment-baseline="hanging">hang</tspan></text>
  <text x="100" y="12" font-size="8" dominant-baseline="central" text-anchor="middle">central</text>
  <text x="4" y="90" font-size="8" rotate="0 10 20 30 40">Turn me</text>
  <g stroke="#c0392b" text-decoration="line-through"><text x="70" y="90" font-size="8" fill="#2c3e50">Strike <tspan text-decoration="overline" fill="#27ae60">over</tspan></text></g>
</svg>
