<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="root">
  <!-- times: 0 125 250 400 500 700 900 1500 -->
  <!-- SMIL values (design.md A5): calcModes, keyTimes and keySplines, paced, to, by, additive and accumulate, set, inheritance. -->
  <rect id="values" width="10" height="10"><animate attributeName="stroke-width" values="0;10;4" keyTimes="0;0.25;1" dur="1s"/></rect>
  <rect id="spline" width="10" height="10"><animate attributeName="opacity" values="0;1" keySplines="0.5 0 0.5 1" calcMode="spline" dur="1s"/></rect>
  <rect id="discrete" width="10" height="10"><animate attributeName="opacity" values="0;0.5;1" calcMode="discrete" dur="1s"/></rect>
  <rect id="paced" width="10" height="10"><animate attributeName="fill" values="rgb(0,0,0);rgb(30,0,0);rgb(30,90,0)" calcMode="paced" dur="1s"/></rect>
  <rect id="pacedlength" width="10" height="10"><animate attributeName="stroke-width" values="0;2;10" calcMode="paced" dur="1s"/></rect>
  <rect id="to" width="10" height="10" opacity="0.2"><animate attributeName="opacity" to="1" dur="1s"/></rect>
  <rect id="by" x="10" width="10" height="10"><animate attributeName="x" by="100" dur="1s"/></rect>
  <rect id="fromby" x="10" width="10" height="10"><animate attributeName="x" from="20" by="100" dur="1s" additive="sum"/></rect>
  <rect id="additive" x="5" width="10" height="10"><animate attributeName="x" from="0" to="10" dur="1s" additive="sum"/><animate attributeName="x" from="0" to="100" dur="1s" additive="sum"/></rect>
  <rect id="accumulate" width="10" height="10"><animate attributeName="stroke-width" from="0" to="2" dur="0.5s" repeatCount="3" accumulate="sum"/></rect>
  <rect id="set" width="10" height="10" fill="red"><set attributeName="fill" to="green" begin="0.2s" dur="0.4s"/></rect>
  <rect id="units" width="10" height="10"><animate attributeName="x" from="0" to="100%" dur="1s"/></rect>
  <rect id="color" width="10" height="10"><animate attributeName="fill" from="#000" to="#ff0" dur="1s"/></rect>
  <rect id="keyword" width="10" height="10"><animate attributeName="visibility" values="visible;hidden" dur="1s"/></rect>
  <rect id="dash" width="10" height="10"><animate attributeName="stroke-dasharray" from="0 10" to="10 0" dur="1s"/></rect>
  <g id="parent"><animate attributeName="fill" from="rgb(0,0,0)" to="rgb(200,0,0)" dur="1s"/><rect id="child" width="10" height="10"/></g>
  <rect id="current" width="10" height="10" color="blue"><animate attributeName="fill" from="red" to="currentColor" dur="1s"/></rect>
  <rect id="invalid" width="10" height="10"><animate attributeName="opacity" values="0;x;1" dur="1s"/></rect>
</svg>
