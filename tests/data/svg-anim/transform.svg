<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="root">
  <!-- times: 0 250 500 1500 -->
  <!-- animateTransform (design.md A6): each type, additive over the attribute, accumulate, a gradient's transform. -->
  <style>#rule { transform: translate(1px, 1px) }</style>
  <rect id="translate" width="10" height="10"><animateTransform attributeName="transform" type="translate" from="0 0" to="100 50" dur="1s"/></rect>
  <rect id="scale" width="10" height="10"><animateTransform attributeName="transform" type="scale" from="1" to="3" dur="1s"/></rect>
  <rect id="rotate" width="10" height="10"><animateTransform attributeName="transform" type="rotate" from="0 5 5" to="90 5 5" dur="1s"/></rect>
  <rect id="skew" width="10" height="10"><animateTransform attributeName="transform" type="skewX" from="0" to="30" dur="1s"/></rect>
  <rect id="additive" width="10" height="10" transform="scale(2)"><animateTransform attributeName="transform" type="translate" from="0" to="100" dur="1s" additive="sum"/></rect>
  <rect id="accumulate" width="10" height="10"><animateTransform attributeName="transform" type="rotate" from="0" to="90" dur="1s" repeatCount="3" accumulate="sum"/></rect>
  <rect id="rule" width="10" height="10"><animateTransform attributeName="transform" type="translate" from="0 0" to="100 0" dur="1s"/></rect>
  <linearGradient id="gradient"><animateTransform attributeName="gradientTransform" type="scale" from="1" to="3" dur="1s"/></linearGradient>
</svg>
